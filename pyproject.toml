[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "generalized-belief-states"
version = "0.1.0"
description = "Fit predictive, recurrent abstractions of trained transformers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Artemy Kolchinsky"}]
dependencies = ["torch>=2.6", "numpy>=1.24", "transformers>=5.20,<6"]

[project.scripts]
gbs = "gbs.cli:main"

[project.urls]
Repository = "https://github.com/artemyk/gbs"

[project.optional-dependencies]
test = ["pytest>=8"]
demo = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
